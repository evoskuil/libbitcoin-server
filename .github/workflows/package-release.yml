name: Package Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag whose signed binaries are packaged."
        required: true
        type: string

permissions:
  contents: write

jobs:

  stage:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Stage test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir staged
          for FILE in bs-linux-x64 bs-linux-x64-shani bs-linux-arm64 bs-linux-arm64-sha2 selector-linux-x64 selector-linux-arm64 bs-windows-x64.exe bs-windows-x64-shani.exe bs-windows-arm64.exe bs-windows-arm64-sha2.exe selector-windows-x64.exe selector-windows-arm64.exe bs-macos-x64 bs-macos-arm64; do
            gh run download 41745735609 --repo libbitcoin/libbitcoin-server --name "${FILE%.exe}" --dir staged
          done
          ls -la staged
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --passphrase '' --quick-gen-key "libbitcoin package test" ed25519 sign 1d
          gpg --batch --armor --export > test-key.asc
          for FILE in staged/*; do
            gpg --batch --armor --detach-sign "${FILE}"
          done
          ls -la staged
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --prerelease \
            --verify-tag --title "${TAG} package test" --notes "Package Release test." \
            staged/* test-key.asc

  version:
    needs: stage
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Compute version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  debian:
    needs: version
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - architecture: "amd64"
            selector: "selector-linux-x64"
            baseline: "bs-linux-x64"
            baseline_requires: "avx2"
            optimized: "bs-linux-x64-shani"
            optimized_requires: "shani avx2 sse41"

          - architecture: "arm64"
            selector: "selector-linux-arm64"
            baseline: "bs-linux-arm64"
            baseline_requires: ""
            optimized: "bs-linux-arm64-sha2"
            optimized_requires: "aes sha2"

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'libbitcoin-server'

      - name: Load test key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.tag }}" --repo "${GITHUB_REPOSITORY}" \
            --pattern test-key.asc --output test-key.asc
          { echo "PUBLIC_KEY<<EOF"; cat test-key.asc; echo "EOF"; } >> "$GITHUB_ENV"

      - name: Download release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bash libbitcoin-server/.github/packaging/fetch.sh
          "${{ github.event.inputs.tag }}"
          binaries
          "${{ matrix.selector }}"
          "${{ matrix.baseline }}"
          "${{ matrix.optimized }}"

      - name: Assemble package
        shell: bash
        run: |
          PACKAGING="libbitcoin-server/.github/packaging/debian"
          LIBRARY="package/usr/lib/libbitcoin-server"
          mkdir -p package/DEBIAN "${LIBRARY}" packages

          install -m 0755 "binaries/${{ matrix.selector }}" "${LIBRARY}/selector"
          install -m 0755 "binaries/${{ matrix.baseline }}" "${LIBRARY}/${{ matrix.baseline }}"
          install -m 0755 "binaries/${{ matrix.optimized }}" "${LIBRARY}/${{ matrix.optimized }}"

          sed -e "s|@VERSION@|${VERSION}|" \
              -e "s|@ARCHITECTURE@|${{ matrix.architecture }}|" \
              "${PACKAGING}/control.in" > package/DEBIAN/control

          sed -e "s|@BASELINE@|${{ matrix.baseline }}|" \
              -e "s|@BASELINE_REQUIRES@|${{ matrix.baseline_requires }}|" \
              -e "s|@OPTIMIZED@|${{ matrix.optimized }}|" \
              -e "s|@OPTIMIZED_REQUIRES@|${{ matrix.optimized_requires }}|" \
              "${PACKAGING}/postinst.in" > package/DEBIAN/postinst

          install -m 0755 "${PACKAGING}/prerm" package/DEBIAN/prerm
          chmod 0755 package/DEBIAN/postinst

          dpkg-deb --root-owner-group --build package \
            "packages/libbitcoin-server_${VERSION}_${{ matrix.architecture }}.deb"
          dpkg-deb --info "packages/libbitcoin-server_${VERSION}_${{ matrix.architecture }}.deb"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-debian-${{ matrix.architecture }}
          path: packages/*
          retention-days: 1
          if-no-files-found: error

      - name: Assemble image binaries
        shell: bash
        run: |
          IMAGE="image/${{ matrix.architecture }}"
          mkdir -p "${IMAGE}"

          install -m 0755 "binaries/${{ matrix.selector }}" "${IMAGE}/selector"
          install -m 0755 "binaries/${{ matrix.optimized }}" "${IMAGE}/${{ matrix.optimized }}"
          install -m 0755 "binaries/${{ matrix.baseline }}" "${IMAGE}/${{ matrix.baseline }}"

          printf '%s %s\n%s %s\n' \
            "${{ matrix.optimized }}" "${{ matrix.optimized_requires }}" \
            "${{ matrix.baseline }}" "${{ matrix.baseline_requires }}" \
            > "${IMAGE}/variants"

      - name: Upload image binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.architecture }}
          path: image
          retention-days: 1
          if-no-files-found: error

  docker:
    needs: [ version, debian ]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'libbitcoin-server'

      - name: Retrieve image binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: libbitcoin-server/.github/packaging/docker

      - name: Prepare buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: libbitcoin-server/.github/packaging/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/libbitcoin-server:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  windows:
    needs: version
    runs-on: windows-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - suffix: "x64"
            architecture: "x64os"
            selector: "selector-windows-x64.exe"
            baseline: "bs-windows-x64.exe"
            baseline_requires: "avx2"
            optimized: "bs-windows-x64-shani.exe"
            optimized_requires: "shani avx2 sse41"

          - suffix: "arm64"
            architecture: "arm64"
            selector: "selector-windows-arm64.exe"
            baseline: "bs-windows-arm64.exe"
            baseline_requires: ""
            optimized: "bs-windows-arm64-sha2.exe"
            optimized_requires: "aes sha2"

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'libbitcoin-server'

      - name: Load test key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.tag }}" --repo "${GITHUB_REPOSITORY}" \
            --pattern test-key.asc --output test-key.asc
          { echo "PUBLIC_KEY<<EOF"; cat test-key.asc; echo "EOF"; } >> "$GITHUB_ENV"

      - name: Download release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bash libbitcoin-server/.github/packaging/fetch.sh
          "${{ github.event.inputs.tag }}"
          binaries
          "${{ matrix.selector }}"
          "${{ matrix.baseline }}"
          "${{ matrix.optimized }}"

      - name: Prepare Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $workspace = "${{ github.workspace }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q `
            "/DAppVersion=$env:VERSION" `
            "/DArchitecture=${{ matrix.architecture }}" `
            "/DSourceDir=$workspace\binaries" `
            "/DOutputDir=$workspace\installers" `
            "/DOutputBase=libbitcoin-server-$env:VERSION-windows-${{ matrix.suffix }}-setup" `
            "/DSelector=${{ matrix.selector }}" `
            "/DBaseline=${{ matrix.baseline }}" `
            "/DBaselineRequires=${{ matrix.baseline_requires }}" `
            "/DOptimized=${{ matrix.optimized }}" `
            "/DOptimizedRequires=${{ matrix.optimized_requires }}" `
            "$workspace\libbitcoin-server\.github\packaging\windows\bs.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows-${{ matrix.suffix }}
          path: installers/*
          retention-days: 1
          if-no-files-found: error

  manifests:
    needs: [ version, windows, docker ]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/libbitcoin-server:${{ needs.version.outputs.version }}@${{ needs.docker.outputs.digest }}

    steps:
      - name: Checkout packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'libbitcoin-server'

      - name: Load test key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.tag }}" --repo "${GITHUB_REPOSITORY}" \
            --pattern test-key.asc --output test-key.asc
          { echo "PUBLIC_KEY<<EOF"; cat test-key.asc; echo "EOF"; } >> "$GITHUB_ENV"

      - name: Download release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bash libbitcoin-server/.github/packaging/fetch.sh
          "${{ github.event.inputs.tag }}"
          binaries
          bs-macos-arm64
          bs-macos-x64

      - name: Retrieve installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-windows-*
          merge-multiple: true
          path: installers

      - name: Generate Homebrew formula
        shell: bash
        run: |
          mkdir -p manifests
          sed -e "s|@VERSION@|${VERSION}|" \
              -e "s|@RELEASE_URL@|${RELEASE_URL}|" \
              -e "s|@SHA256_ARM64@|$(sha256sum binaries/bs-macos-arm64 | cut -d' ' -f1)|" \
              -e "s|@SHA256_X64@|$(sha256sum binaries/bs-macos-x64 | cut -d' ' -f1)|" \
              libbitcoin-server/.github/packaging/homebrew/libbitcoin-server.rb.in \
              > manifests/libbitcoin-server.rb

      - name: Generate winget manifests
        shell: bash
        run: |
          WINGET="libbitcoin-server/.github/packaging/winget"
          X64="installers/libbitcoin-server-${VERSION}-windows-x64-setup.exe"
          ARM64="installers/libbitcoin-server-${VERSION}-windows-arm64-setup.exe"
          for template in "${WINGET}"/*.yaml.in; do
            sed -e "s|@VERSION@|${VERSION}|" \
                -e "s|@RELEASE_URL@|${RELEASE_URL}|" \
                -e "s|@SHA256_X64@|$(sha256sum "${X64}" | cut -d' ' -f1 | tr a-f A-F)|" \
                -e "s|@SHA256_ARM64@|$(sha256sum "${ARM64}" | cut -d' ' -f1 | tr a-f A-F)|" \
                "${template}" > "manifests/$(basename "${template}" .in)"
          done

      - name: Generate Umbrel app
        shell: bash
        run: |
          UMBREL="libbitcoin-server/.github/packaging/umbrel/bitcoin-server"
          APP="umbrel/bitcoin-server"
          mkdir -p "${APP}"
          cp -r "${UMBREL}/data" "${APP}/"
          sed -e "s|@VERSION@|${VERSION}|" "${UMBREL}/umbrel-app.yml.in" > "${APP}/umbrel-app.yml"
          sed -e "s|@IMAGE@|${IMAGE}|" "${UMBREL}/docker-compose.yml.in" > "${APP}/docker-compose.yml"
          tar -czf "manifests/libbitcoin-server-${VERSION}-umbrel.tar.gz" -C umbrel bitcoin-server

      - name: Upload manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-manifests
          path: manifests/*
          retention-days: 1
          if-no-files-found: error

  startos:
    needs: [ version, docker ]
    runs-on: ${{ matrix.image }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - target: "x86"
            image: "ubuntu-latest"

          - target: "arm"
            image: "ubuntu-24.04-arm"

    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/libbitcoin-server:${{ needs.version.outputs.version }}@${{ needs.docker.outputs.digest }}

    steps:
      - name: Checkout packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'libbitcoin-server'

      - name: Prepare Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Prepare start-cli
        uses: Start9Labs/start-technologies/.github/actions/install-start-cli@61d175bf10e10784e0b62459dc0596bb22aa9fd5

      - name: Build package
        shell: bash
        working-directory: libbitcoin-server/.github/packaging/startos
        env:
          DEV_KEY: ${{ secrets.STARTOS_DEV_KEY }}
        run: |
          mkdir -p ~/.startos .startos assets
          if [ -n "${DEV_KEY}" ]; then
            printf '%s' "${DEV_KEY}" > ~/.startos/id.key.pem
          else
            start-cli init-key
          fi
          cp ~/.startos/id.key.pem .startos/build.key.pem

          sed -i "s|@IMAGE@|${IMAGE}|" startos/manifest/index.ts
          sed -i "s|@VERSION@|${VERSION}|g" startos/versions/current.ts

          npm install
          make ${{ matrix.target }}

          mkdir -p "${{ github.workspace }}/packages"
          for package in *.s9pk; do
            mv "${package}" "${{ github.workspace }}/packages/${package%.s9pk}-${VERSION}.s9pk"
          done

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-startos-${{ matrix.target }}
          path: packages/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [ debian, windows, manifests, startos ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Retrieve packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      - name: Compute checksums
        shell: bash
        working-directory: packages
        run: |
          sha256sum * > packages-sha256.txt
          cat packages-sha256.txt

      - name: Attach packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.inputs.tag }}"
          --repo "${{ github.repository }}"
          --clobber
          packages/*

  apt:
    needs: [ version, publish ]
    environment: release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'apt'
          repository: ${{ github.repository_owner }}/apt
          token: ${{ secrets.DISTRIBUTE_TOKEN }}

      - name: Download packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.tag }}" --repo "${{ github.repository }}" \
            --dir packages --pattern "libbitcoin-server_${VERSION}_*.deb" --pattern packages-sha256.txt
          cd packages
          sha256sum --check --ignore-missing packages-sha256.txt

      - name: Prepare tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils

      - name: Generate test signing key
        shell: bash
        run: |
          gpg --batch --passphrase '' --quick-gen-key "libbitcoin distribute test" ed25519 sign 1d

      - name: Generate repository
        shell: bash
        working-directory: apt
        env:
          SIGNING_PASSPHRASE: ""
        run: |
          POOL="pool/main/l/libbitcoin-server"
          SUITE="dists/stable"
          git rm -rq --ignore-unmatch "${POOL}" dists libbitcoin.asc .nojekyll
          mkdir -p "${POOL}"
          cp ../packages/*.deb "${POOL}/"

          for ARCHITECTURE in amd64 arm64; do
            BINARY="${SUITE}/main/binary-${ARCHITECTURE}"
            mkdir -p "${BINARY}"
            dpkg-scanpackages --arch "${ARCHITECTURE}" pool > "${BINARY}/Packages"
            gzip -9nk "${BINARY}/Packages"
          done

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=libbitcoin \
            -o APT::FTPArchive::Release::Label=libbitcoin \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release "${SUITE}" > Release
          mv Release "${SUITE}/Release"

          SIGN=(gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0)
          "${SIGN[@]}" --clearsign --output "${SUITE}/InRelease" "${SUITE}/Release" <<< "${SIGNING_PASSPHRASE}"
          "${SIGN[@]}" --armor --detach-sign --output "${SUITE}/Release.gpg" "${SUITE}/Release" <<< "${SIGNING_PASSPHRASE}"
          gpg --batch --armor --export > libbitcoin.asc
          touch .nojekyll

          find . -path ./.git -prune -o -type f -print | sort

      - name: Publish repository
        shell: bash
        working-directory: apt
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git checkout --orphan publication
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "libbitcoin-server ${VERSION}."
          git push --force origin "publication:${BRANCH}"

  homebrew:
    needs: [ version, publish ]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'tap'
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.DISTRIBUTE_TOKEN }}

      - name: Download formula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.tag }}" --repo "${{ github.repository }}" \
            --dir packages --pattern libbitcoin-server.rb --pattern packages-sha256.txt
          cd packages
          sha256sum --check --ignore-missing packages-sha256.txt

      - name: Commit formula
        shell: bash
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../packages/libbitcoin-server.rb Formula/
          git add Formula/libbitcoin-server.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "libbitcoin-server ${VERSION}."
          git push
